<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internships | InternHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <aside class="sidebar">
        <h2>InternHub</h2>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="profile.html">My Profile</a>
        <a href="internships.html">Internships</a>
        <a href="my-applications.html">My Applications</a>
        <button onclick="logout()">Logout</button>
    </aside>

    <main class="dashboard-main">
        <div class="dashboard-header">
            <div>
                <h1>Available Internships</h1>
                <p>Search and apply for suitable internship opportunities.</p>
            </div>
        </div>

        <section class="filter-card">
            <input type="text" id="searchInput" placeholder="Search by title or company">
            <input type="text" id="locationInput" placeholder="Location">

            <select id="typeInput">
                <option value="">All Types</option>
                <option value="Remote">Remote</option>
                <option value="On-site">On-site</option>
                <option value="Hybrid">Hybrid</option>
            </select>

            <button onclick="loadInternships()">Search</button>
        </section>

        <section id="internshipList" class="card-grid"></section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/internships.js"></script>
</body>
</html>
