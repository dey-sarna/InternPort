<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | InternPort</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <aside class="sidebar">
        <h2>InternPort</h2>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="manage-internships.html">Manage Internships</a>
        <a href="manage-applications.html">Applications</a>
        <button onclick="logout()">Logout</button>
    </aside>

    <main class="dashboard-main">
        <div class="dashboard-header">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Manage internships and student applications.</p>
            </div>
        </div>

        <section class="stats-grid">
            <div class="stat-card">
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>

            <div class="stat-card">
                <h3 id="totalInternships">0</h3>
                <p>Total Internships</p>
            </div>

            <div class="stat-card">
                <h3 id="totalApplications">0</h3>
                <p>Total Applications</p>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
